<div class="registro-page">
  <div class="registro-card">

    <div class="registro-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 814 1000" width="40" height="40" fill="currentColor">
        <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 790.7 0 663 0 541.8c0-207.8 135.4-317.8 269.3-317.8 71 0 130.1 46.4 173.9 46.4 42.4 0 108.5-49.2 190.7-49.2zm-234.5-181c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/>
      </svg>
    </div>

    <h1>Crear cuenta</h1>
    <p class="subtitle">Únete a Apple Store</p>

    @if (error()) {
      <div class="error-msg">{{ error() }}</div>
    }

    <div class="form-group">
      <input
        type="text"
        placeholder="Nombre completo"
        [(ngModel)]="nombre"
        class="input-field"
        autocomplete="name"
      />
    </div>

    <div class="form-group">
      <input
        type="email"
        placeholder="Email"
        [(ngModel)]="email"
        class="input-field"
        autocomplete="email"
      />
    </div>

    <div class="form-group">
      <input
        type="password"
        placeholder="Contraseña"
        [(ngModel)]="password"
        class="input-field"
        autocomplete="new-password"
      />
    </div>

    <div class="form-group">
      <input
        type="password"
        placeholder="Confirmar contraseña"
        [(ngModel)]="confirmar"
        (keyup.enter)="registrar()"
        class="input-field"
        autocomplete="new-password"
      />
    </div>

    <button class="btn-registro" (click)="registrar()" [disabled]="cargando()">
      @if (cargando()) {
        <span class="spinner"></span>
      } @else {
        Crear cuenta
      }
    </button>

    <div class="divider">
      <span>¿Ya tienes cuenta?</span>
    </div>

    <a routerLink="/login" class="btn-login">Iniciar sesión</a>

  </div>
</div>
